<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#bgGrad)" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- Geometric 'R' Mark -->
  <path d="M10 8h6.5a3.5 3.5 0 0 1 3.5 3.5v0a3.5 3.5 0 0 1-3.5 3.5H10V8z" fill="none" stroke="url(#violetGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M10 15v8" stroke="url(#violetGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M14 15l5.5 8" stroke="url(#violetGrad)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Glowing Violet Dot in Top-Right -->
  <circle cx="23" cy="8" r="2.2" fill="#8b5cf6" opacity="0.4" filter="url(#glow)"/>
  <circle cx="23" cy="8" r="1.8" fill="#a855f7"/>
  <circle cx="23" cy="8" r="0.9" fill="#ffffff"/>
</svg>
